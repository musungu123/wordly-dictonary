<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Simple Dictionary</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:,">
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- LINK YOUR JS FILE HERE -->
  <script src="script.js" defer></script>
</head>

<body class="bg-indigo-50 min-h-screen">

  <main class="max-w-xl mx-auto p-6">

    <header class="text-center mb-6">
      <h1 class="text-4xl font-bold text-indigo-700">Dictionary</h1>
      <p class="text-gray-600">Search for any English word</p>
    </header>

    <!-- Search bar -->
    <form id="search-form" class="flex gap-2" aria-label="Search for a word">
      <input
        id="word-input"
        type="text"
        placeholder="Type a word..."
        aria-label="Word to search"
        class="flex-1 p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-400"
      />
      <button
        type="submit"
        aria-label="Search"
        class="bg-indigo-600 text-white px-5 rounded-lg hover:bg-indigo-800 transition"
      >
        Search
      </button>
    </form>

    <!-- Messages (loading, errors) -->
    <p id="status" class="text-center text-gray-600 mt-4" aria-live="polite"></p>

    <!-- Results go here -->
    <section id="results" class="mt-4" aria-label="Search results"></section>

  </main>
  
</body>
</html>
